<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }
  </style>
  <defs>
    <marker id="arrow-claude" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0 2, 8 5, 0 8" fill="#4a4a4a"/>
    </marker>
    <filter id="shadow-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>
  <rect width="960" height="520" fill="#f8f6f3"/>
  <text x="480" y="45" text-anchor="middle" fill="#1a1a1a" font-size="20" font-weight="800" letter-spacing="0.03em">CHRONOLOGICAL EVOLUTION OF MIXTURE OF EXPERTS (MoE)</text>
  <text x="480" y="70" text-anchor="middle" fill="#6a6a6a" font-size="13" font-weight="400">Chronological breakthroughs in sparse conditional computation from early neural networks to DeepSeek-V3</text>
  <!-- Node m1: 1991 • Jacobs et al. -->
  <rect x="30" y="115" width="180" height="110" rx="12" ry="12" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="2.2" filter="url(#shadow-soft)"/>
  <text x="120" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">1991 • Jacobs et al.</text>
  <text x="120" y="157" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a4a4a">Adaptive Local Experts</text>
  <text x="44" y="184" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Supervised ensemble</text>
  <text x="44" y="202" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Gating network router</text>
  <!-- Node m2: 2017 • Shazeer et al. -->
  <rect x="270" y="115" width="180" height="110" rx="12" ry="12" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="2.2" filter="url(#shadow-soft)"/>
  <text x="360" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">2017 • Shazeer et al.</text>
  <text x="360" y="157" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a4a4a">Sparsely-Gated MoE</text>
  <text x="284" y="184" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Noisy Top-K gating</text>
  <text x="284" y="202" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Auxiliary load-balance loss</text>
  <!-- Node m3: 2020 • GShard -->
  <rect x="510" y="115" width="180" height="110" rx="12" ry="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.2" filter="url(#shadow-soft)"/>
  <text x="600" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">2020 • GShard</text>
  <text x="600" y="157" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a4a4a">MoE in Transformers</text>
  <text x="524" y="184" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Top-2 random routing</text>
  <text x="524" y="202" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Static Expert Capacity</text>
  <!-- Node m4: 2021 • Switch -->
  <rect x="750" y="115" width="180" height="110" rx="12" ry="12" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="2.2" filter="url(#shadow-soft)"/>
  <text x="840" y="139" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">2021 • Switch</text>
  <text x="840" y="157" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a4a4a">Switch Transformer</text>
  <text x="764" y="184" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Simplified Top-1 routing</text>
  <text x="764" y="202" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Scale-invariant balance loss</text>
  <!-- Node m5: 2022 • ST-MoE -->
  <rect x="750" y="335" width="180" height="110" rx="12" ry="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.2" filter="url(#shadow-soft)"/>
  <text x="840" y="359" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">2022 • ST-MoE</text>
  <text x="840" y="377" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a4a4a">Stability &amp; Scale</text>
  <text x="764" y="404" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Router Z-Loss prevents inf</text>
  <text x="764" y="422" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Expert Dropout regularizer</text>
  <!-- Node m6: 2024 • DeepSeek-V2 -->
  <rect x="510" y="335" width="180" height="110" rx="12" ry="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.2" filter="url(#shadow-soft)"/>
  <text x="600" y="359" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">2024 • DeepSeek-V2</text>
  <text x="600" y="377" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a4a4a">Shared Expert Isolation</text>
  <text x="524" y="404" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Routed &amp; shared expert split</text>
  <text x="524" y="422" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Latent KV cache (MLA)</text>
  <!-- Node m7: 2026 • DeepSeek-V3 -->
  <rect x="270" y="335" width="180" height="110" rx="12" ry="12" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="2.2" filter="url(#shadow-soft)"/>
  <text x="360" y="359" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1a1a1a">2026 • DeepSeek-V3</text>
  <text x="360" y="377" text-anchor="middle" font-size="11.5" font-weight="600" fill="#4a4a4a">Aux-Loss-Free Routing</text>
  <text x="284" y="404" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Dynamic routing bias</text>
  <text x="284" y="422" text-anchor="start" font-size="10.5" fill="#5a5a5a">• Sequence load balancing</text>
  <!-- Legend Box -->
  <rect x="30" y="335" width="180" height="110" rx="12" ry="12" fill="#ffffff" stroke="#4a4a4a" stroke-width="1.8" stroke-dasharray="4,4"/>
  <text x="120" y="357" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a" letter-spacing="0.05em">ERA KEY</text>
  <circle cx="48" cy="375" r="4.5" fill="#e8e6e3" stroke="#4a4a4a" stroke-width="1.2"/>
  <text x="60" y="378.5" text-anchor="start" font-size="10" font-weight="500" fill="#5a5a5a">Early Foundations (1991)</text>
  <circle cx="48" cy="392" r="4.5" fill="#a8c5e6" stroke="#4a4a4a" stroke-width="1.2"/>
  <text x="60" y="395.5" text-anchor="start" font-size="10" font-weight="500" fill="#5a5a5a">Top-K Sparsity (2017)</text>
  <circle cx="48" cy="409" r="4.5" fill="#9dd4c7" stroke="#4a4a4a" stroke-width="1.2"/>
  <text x="60" y="412.5" text-anchor="start" font-size="10" font-weight="500" fill="#5a5a5a">Transformer Scale</text>
  <circle cx="48" cy="426" r="4.5" fill="#f4e4c1" stroke="#4a4a4a" stroke-width="1.2"/>
  <text x="60" y="429.5" text-anchor="start" font-size="10" font-weight="500" fill="#5a5a5a">Stability &amp; SOTA</text>
  <!-- Connection: Noisy Top-K -->
  <line x1="210" y1="170" x2="270" y2="170" stroke="#4a4a4a" stroke-width="2.2" marker-end="url(#arrow-claude)"/>
  <rect x="203.0" y="147" width="74" height="13" fill="#f8f6f3" rx="3" opacity="0.95"/>
  <text x="240" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#4a4a4a">Noisy Top-K</text>
  <!-- Connection: Scaling FFNs -->
  <line x1="450" y1="170" x2="510" y2="170" stroke="#4a4a4a" stroke-width="2.2" marker-end="url(#arrow-claude)"/>
  <rect x="440.0" y="147" width="80" height="13" fill="#f8f6f3" rx="3" opacity="0.95"/>
  <text x="480" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#4a4a4a">Scaling FFNs</text>
  <!-- Connection: Capacity Logic -->
  <line x1="690" y1="170" x2="750" y2="170" stroke="#4a4a4a" stroke-width="2.2" marker-end="url(#arrow-claude)"/>
  <rect x="674.0" y="147" width="92" height="13" fill="#f8f6f3" rx="3" opacity="0.95"/>
  <text x="720" y="156" text-anchor="middle" font-size="10" font-weight="700" fill="#4a4a4a">Capacity Logic</text>
  <!-- Connection: bf16 stability -->
  <line x1="840" y1="225" x2="840" y2="335" stroke="#4a4a4a" stroke-width="2.2" marker-end="url(#arrow-claude)"/>
  <rect x="853" y="275" width="88" height="13" fill="#f8f6f3" rx="3" opacity="0.95"/>
  <text x="855" y="284" text-anchor="start" font-size="10" font-weight="700" fill="#4a4a4a">bf16 stability</text>
  <!-- Connection: Specialization -->
  <line x1="750" y1="390" x2="690" y2="390" stroke="#4a4a4a" stroke-width="2.2" marker-end="url(#arrow-claude)"/>
  <rect x="674.0" y="367" width="92" height="13" fill="#f8f6f3" rx="3" opacity="0.95"/>
  <text x="720" y="376" text-anchor="middle" font-size="10" font-weight="700" fill="#4a4a4a">Specialization</text>
  <!-- Connection: Aux-Loss-Free -->
  <line x1="510" y1="390" x2="450" y2="390" stroke="#4a4a4a" stroke-width="2.2" marker-end="url(#arrow-claude)"/>
  <rect x="437.0" y="367" width="86" height="13" fill="#f8f6f3" rx="3" opacity="0.95"/>
  <text x="480" y="376" text-anchor="middle" font-size="10" font-weight="700" fill="#4a4a4a">Aux-Loss-Free</text>
  <text x="480" y="495" text-anchor="middle" fill="#9ca3af" font-size="10" font-weight="500">Wiki Companion Series: MoE Chronological Milestones. Generated 2026.</text>
</svg>